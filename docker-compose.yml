services:
  bot2_service:
    build: .
    container_name: bot2_container
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Сохраняем базы данных shelve
      - bot2_data:/app/data
      # Сохраняем ключи и видео между перезапусками
      - bot2_keys:/app/keys
      - bot2_video:/app/video
    ports:
      - "9091:9090"  # Порт для Prometheus (отличный от первого бота!)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot2_data:
    name: bot2_data_volume
  bot2_keys:
    name: bot2_keys_volume
  bot2_video:
    name: bot2_video_volume