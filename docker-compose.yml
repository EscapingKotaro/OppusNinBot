services:
  bot2_service:
    build: .
    container_name: bot2_container
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      # Пробрасываем существующие папки с сервера в контейнер
      - ./keys:/app/keys      # <--- ГЛАВНОЕ ИСПРАВЛЕНИЕ
      - ./data:/app/data      # Чтобы базы shelve сохранялись
      - ./video:/app/video    # Чтобы видео были доступны
    ports:
      - "9091:9090"           # Порт для метрик Prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"