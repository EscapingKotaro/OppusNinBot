services:
  bot2_service:
    build: .
    container_name: bot2_container
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./keys:/app/keys     
      - ./data:/app/data      
      - ./video:/app/video   
    ports:
      - "9091:9090"           # Порт для метрик Prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"